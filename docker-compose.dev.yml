version: '3.8'

services:
  # Backend Django en mode dev
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=manga_project.settings.development
    volumes:
      - ./backend:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true

  # Frontend React en mode dev
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    command: npm start
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true

  # Base de données avec données de test
  db:
    environment:
      - POSTGRES_DB=manga_dev_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/fixtures:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  # Redis pour le développement
  redis:
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --notify-keyspace-events Ex

  # nginx en mode dev (optionnel, pour tester le reverse proxy)
  nginx:
    volumes:
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"

  # Mailhog pour tester les emails en développement
  mailhog:
    image: mailhog/mailhog:latest
    container_name: manga_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - manga_network

  # pgAdmin pour gérer la base de données
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: manga_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@manga.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - manga_network

volumes:
  postgres_dev_data:
  pgadmin_data: