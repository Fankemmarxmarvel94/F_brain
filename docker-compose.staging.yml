
services:
  # Backend Django pour staging
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:develop
    environment:
      - DEBUG=0
      - ENVIRONMENT=staging
      - DATABASE_URL=${STAGING_DATABASE_URL}
      - REDIS_URL=${STAGING_REDIS_URL}
      - SECRET_KEY=${STAGING_SECRET_KEY}
      - ALLOWED_HOSTS=${STAGING_DOMAIN}
      - SENTRY_DSN=${STAGING_SENTRY_DSN}
    restart: unless-stopped
    
  # Frontend React pour staging  
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:develop
    environment:
      - REACT_APP_API_URL=https://${STAGING_DOMAIN}/api
      - REACT_APP_ENVIRONMENT=staging
      - REACT_APP_SENTRY_DSN=${STAGING_FRONTEND_SENTRY_DSN}
    restart: unless-stopped

  # Base de données staging
  db:
    environment:
      - POSTGRES_DB=${STAGING_DB_NAME}
      - POSTGRES_USER=${STAGING_DB_USER}
      - POSTGRES_PASSWORD=${STAGING_DB_PASSWORD}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis staging
  redis:
    restart: unless-stopped
    volumes:
      - staging_redis_data:/data

  # Nginx pour staging avec SSL
  nginx:
    environment:
      - DOMAIN=${STAGING_DOMAIN}
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf
      - ${SSL_CERT_PATH}:/etc/nginx/ssl/cert.pem:ro
      - ${SSL_KEY_PATH}:/etc/nginx/ssl/key.pem:ro
    restart: unless-stopped

  # Monitoring avec Prometheus (staging)
  prometheus:
    image: prom/prometheus:latest
    container_name: manga_prometheus_staging
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.staging.yml:/etc/prometheus/prometheus.yml
      - prometheus_staging_data:/prometheus
    networks:
      - manga_network
    restart: unless-stopped

  # Grafana pour les métriques
  grafana:
    image: grafana/grafana:latest
    container_name: manga_grafana_staging
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana_staging_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - manga_network
    restart: unless-stopped

volumes:
  staging_postgres_data:
  staging_redis_data:
  prometheus_staging_data:
  grafana_staging_data: