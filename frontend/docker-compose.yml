# docker-compose.yml - Configuration pour le développement et la production

version: '3.8'

services:
  # Service de développement
  frontend-dev:
    build:
      context: .
      target: build
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev

  # Service de production
  frontend-prod:
    build:
      context: .
      target: production
    ports:
      - "80:80"
    restart: unless-stopped
    profiles:
      - prod

  # Service avec nginx personnalisé pour développement
  frontend-preview:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    restart: unless-stopped
    profiles:
      - preview